<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Ecommerce</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg" data-bs-theme="dark" style="background-color: #212529;">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">E-TECH</a>

      <div class="d-flex gap-2 align-items-center">
        <select class="form-select" id="category" style="width: auto;">
          <option value="Todas">Todas</option>
        </select>
        <input class="form-control" type="search" id="search" placeholder="Buscar produto..."/>
        <button class="btn btn-outline-success" type="button" id="btnRender">Renderizar</button>
      </div>
    </div>
  </nav>

<div class="container mt-3">
    <div id="product-details"></div>
  </div>
  <div class="container mt-4">
    <div id="product-list" class="row row-cols-1 row-cols-md-3 g-4"></div>
  </div>


  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
